name: tests

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow never pushes, so the GITHUB_TOKEN must not stay available to later steps.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Run tests
        run: python -m pytest -q
